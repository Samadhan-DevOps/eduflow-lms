# ─────────────────────────────────────────────────────────────────────────────
# EduFlow LMS — Production reference compose (uses ECR images + env vars)
# Actual production runs on AWS ECS — this is for local prod simulation only
# ─────────────────────────────────────────────────────────────────────────────
services:
  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/eduflow-backend:${IMAGE_TAG:-latest}
    container_name: eduflow-backend
    restart: always
    environment:
      NODE_ENV:       production
      PORT:           5000
      DATABASE_URL:   ${DATABASE_URL}
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS:   ${CORS_ORIGINS}
      LOG_LEVEL:      ${LOG_LEVEL:-info}
      BCRYPT_ROUNDS:  ${BCRYPT_ROUNDS:-12}
    ports:
      - "5000:5000"

  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/eduflow-frontend:${IMAGE_TAG:-latest}
    container_name: eduflow-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
